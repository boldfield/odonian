# Fleet secrets — DO NOT commit real values. Prefer creating these with `kubectl create secret`
# (below) so tokens never land in a file. Both go in the `odonian-fleet` namespace.
#
# 1) The Odonian bearer token (same value the server's `odonian-secret` holds):
#
#    TOKEN=$(kubectl --context admin@summercamp-cp -n odonian \
#              get secret odonian-secret -o jsonpath='{.data.token}' | base64 -d)
#    kubectl --context <target-cluster> -n odonian-fleet \
#      create secret generic odonian-fleet --from-literal=token="$TOKEN"
#
# 2) The forge tokens file (per-owner PATs: `owner=token` per line — e.g. faictory + boldfield),
#    straight from your local ~/.odonian/forge-tokens:
#
#    kubectl --context <target-cluster> -n odonian-fleet \
#      create secret generic odonian-forge-tokens \
#      --from-file=forge-tokens="$HOME/.odonian/forge-tokens"
#
# 3) (workers/reviewers only) The claude subscription token — a long-lived `claude setup-token`
#    value, NOT an API key. The merger doesn't need this:
#
#    claude setup-token      # prints a token; copy it
#    make claude-auth        # hidden prompt; updates Secret and restarts worker/reviewer
#    make claude-auth-check  # read-only synchronization check; no inference calls
#    For noninteractive input use CLAUDE_AUTH_TOKEN_FILE or an inherited
#    CLAUDE_CODE_OAUTH_TOKEN. See deploy/fleet/README.md for overrides and restart impact.
#
# 4) (reviewers only) The codex subscription auth — codex reads ~/.codex/auth.json. Create by
#    running `codex login` on a local machine, then:
#
#    kubectl --context <target-cluster> -n odonian-fleet \
#      create secret generic codex-auth \
#      --from-file=auth.json="$HOME/.codex/auth.json"
#
# The YAML below is only a shape reference (stringData shown for readability; never check in real tokens):
---
apiVersion: v1
kind: Secret
metadata:
  name: odonian-fleet
  namespace: odonian-fleet
type: Opaque
stringData:
  token: "<odonian-bearer-token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: claude-oauth # workers + reviewers only
  namespace: odonian-fleet
type: Opaque
stringData:
  token: "<claude-setup-token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: odonian-forge-tokens
  namespace: odonian-fleet
type: Opaque
stringData:
  forge-tokens: |
    faictory=<token>
    boldfield=<token>
---
apiVersion: v1
kind: Secret
metadata:
  name: codex-auth # reviewers only
  namespace: odonian-fleet
type: Opaque
stringData:
  auth.json: |
    <codex-auth-json>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer
  namespace: odonian-fleet
  labels:
    app.kubernetes.io/name: odonian-fleet
    app.kubernetes.io/component: reviewer
spec:
  # Matches the laptop fleet (4 reviewers). Apply to the amd64 (cp) cluster — reviewers reproduce the
  # build as-merged-with-main, so they need the same toolchain + memory as workers. Model-dynamic:
  # each claims any review task and runs claude with the task's own model (no --model pin).
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/component: reviewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odonian-fleet
        app.kubernetes.io/component: reviewer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # codex needs a WRITABLE ~/.codex (sessions + token refresh). Seed the writable
        # codex-home emptyDir from the read-only codex-auth secret (mounted side-path here).
        - name: codex-auth-setup
          # Version tag is bumped by hand on release; make fleet-image must have pushed this tag first.
          image: docker.summercamp.eastharbor.casa:32050/odonian/fleet:v0.16.0-17-gbd57579
          command: ["sh", "-c", "cp /etc/codex-auth/auth.json /home/agent/.codex/auth.json && chmod 600 /home/agent/.codex/auth.json"]
          volumeMounts:
            - { name: codex-home, mountPath: /home/agent/.codex }
            - { name: codex-auth, mountPath: /etc/codex-auth, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: reviewer
          # Version tag is bumped by hand on release; make fleet-image must have pushed this tag first.
          image: docker.summercamp.eastharbor.casa:32050/odonian/fleet:v0.16.0-17-gbd57579
          args: ["--kind", "review"]
          env:
            - name: ODONIAN_URL
              value: "https://odonian.summercamp.eastharbor.casa"
            - name: ODONIAN_PROJECT
              value: "all"
            - name: ODONIAN_DELIVERY_MODE
              value: "pull_request"
            - name: HOME
              value: /home/agent
            - name: ODONIAN_HOME
              value: /home/agent/.odonian
            - name: ODONIAN_TOKEN
              valueFrom: { secretKeyRef: { name: odonian-fleet, key: token } }
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: { secretKeyRef: { name: claude-oauth, key: token } }
            - name: AGENT_CODEX_MODELS
              value: "gpt-5.5"
            - name: CARGO_BUILD_JOBS
              value: "2"
            - name: GOMAXPROCS
              value: "2"
          volumeMounts:
            - { name: home, mountPath: /home/agent }
            - { name: forge-tokens, mountPath: /etc/fleet, readOnly: true }
            - { name: codex-home, mountPath: /home/agent/.codex }
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "6Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: home
          emptyDir: { sizeLimit: 30Gi }
        - name: forge-tokens
          secret:
            secretName: odonian-forge-tokens
        - name: codex-auth
          secret:
            secretName: codex-auth
        - name: codex-home
          emptyDir: {}
